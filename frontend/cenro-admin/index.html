<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootswatch@4.5.2/dist/minty/bootstrap.min.css"
        crossorigin="anonymous"/>
  <title>WasteWise Admin — Login</title>
  <style>
    body { min-height:100vh; display:flex; align-items:center; justify-content:center; }
    .card { width:360px; }
    .password-wrapper { position: relative; }
    .toggle-btn {
      position: absolute;
      top: 50%;
      right: 10px;
      transform: translateY(-50%);
      border: none;
      background: none;
      cursor: pointer;
      color: #28a745;
      font-size: 0.9rem;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div class="card p-4 shadow">
    <h4 class="mb-3 text-center">WasteWise Admin</h4>
    <div id="msg" class="text-danger mb-2" style="display:none;"></div>
    
    <form id="loginForm">
      <div class="form-group">
        <label>Username</label>
        <input id="username" class="form-control" autocomplete="username" required />
      </div>
      <div class="form-group">
        <label>Password</label>
        <div class="password-wrapper">
          <input id="password" type="password" class="form-control" autocomplete="current-password" required/>
          <button type="button" id="togglePassword" class="toggle-btn">Show</button>
        </div>
      </div>
      <button class="btn btn-success btn-block" type="submit">Log In</button>
      <button class="btn btn-link btn-block" type="button" onclick="location.href='register.html'">Create account</button>
    </form>
  </div>

  <script type="module">
    import { login, getToken } from './auth.js';

    // 1. Cleanup corrupt tokens
    (function cleanupOnLoad() {
      const token = localStorage.getItem('wastewise_admin_token');
      if (token && (token.length < 10 || token === 'null' || token === 'undefined')) {
        localStorage.removeItem('wastewise_admin_token');
        localStorage.removeItem('wastewise_admin_user');
      }
    })();

    // 2. Check existing login
    async function checkExistingAuth() {
      const token = getToken();
      if (token) {
        location.href = 'analytics.html'; 
      }
    }
    checkExistingAuth();

    // 3. Password Toggle
    document.getElementById('togglePassword').addEventListener('click', () => {
      const pwd = document.getElementById('password');
      const toggleBtn = document.getElementById('togglePassword');
      
      if (pwd.type === 'password') {
        pwd.type = 'text';
        toggleBtn.textContent = 'Hide';
      } else {
        pwd.type = 'password';
        toggleBtn.textContent = 'Show';
      }
    });

    // 4. Login Logic
    const form = document.getElementById('loginForm');
    const msg = document.getElementById('msg');

    function showError(message) {
      msg.style.display = 'block';
      msg.textContent = message;
      setTimeout(() => { msg.style.display = 'none'; }, 5000);
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const submitBtn = form.querySelector('button[type="submit"]');
      const originalText = submitBtn.textContent;
      
      submitBtn.textContent = 'Logging in...';
      submitBtn.disabled = true;
      msg.style.display = 'none';

      try {
        await login(username, password);
        location.href = 'analytics.html';
      } catch (err) {
        console.error('Login error:', err);
        showError(err.message || 'Login failed');
        document.getElementById('password').value = '';
      } finally {
        submitBtn.textContent = originalText;
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
