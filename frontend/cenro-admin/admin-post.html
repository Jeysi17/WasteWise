<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="posts.css" />
  <link rel="stylesheet" href="enhanced-tables.css" />
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootswatch@4.5.2/dist/minty/bootstrap.min.css"
    crossorigin="anonymous"
  />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <title>WasteWiseAdmin — Posts</title>
</head>
<body>

<div id="sidebar" class="sidebar">
  <button onclick="location.href='analytics.html'">HOME</button>
  <button onclick="location.href='admin-post.html'">POST</button>
  <button onclick="location.href='schedule.html'">SCHEDULE</button>
</div>

<div class="topbar-wrapper">
  <div class="header">WasteWise Admin</div>
  <div class="main">
    <div class="controls">
      <div class="date-filter-container" style="display: flex; align-items: center; flex-wrap: wrap; gap: 10px;">
        <label for="fromDate" class="date-label" style="font-weight: bold; margin: 0;">FILTER POSTS FROM:</label>
        <input type="date" id="fromDate" class="date-input" style="padding: 8px; border: 1px solid #ddd; border-radius: 4px;" onchange="applyFilters()" />

        <label for="toDate" class="date-label" style="font-weight: bold; margin: 0;">TO:</label>
        <input type="date" id="toDate" class="date-input" style="padding: 8px; border: 1px solid #ddd; border-radius: 4px;" onchange="applyFilters()" />

        <button class="btn btn-success btn-sm" onclick="clearDateFilters()">Clear Filter</button>

        <label for="filterBarangay" style="font-weight: bold; margin: 0; margin-left: 15px;">BARANGAY:</label>
        <select id="filterBarangay" style="padding: 8px 12px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px;" onchange="applyFilters()">
          <option value="all">All Barangays</option>
          <option>Aguado</option>
          <option>Cabezas</option>
          <option>Cabuco</option>
          <option>Conchu</option>
          <option>De Ocampo</option>
          <option>Gregorio</option>
          <option>Hugo Perez</option>
          <option>Inocencio</option>
          <option>Lallana</option>
          <option>Lapidario</option>
          <option>Luciano</option>
          <option>Osorio</option>
          <option>San Agustin</option>
        </select>
        
        <div class="btn-group" style="margin-left: 20px; border-radius: 4px; overflow: hidden;">
          <button id="viewApprovedBtn" class="btn btn-primary" onclick="switchView('approved')">
            Forwarded Posts
          </button>
          <button id="viewSolvedBtn" class="btn btn-outline-primary" onclick="switchView('solved')">
            Solved Posts
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="approved-view">
  <div class="content-area-enhanced">
    <h3>Forwarded Posts (Ready to Solve)</h3>
    <div class="table-container">
      <table class="enhanced-table">
        <thead>
          <tr>
            <th>Name</th>
            <th>Title</th>
            <th>Image</th>
            <th>Location</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="postsTable"></tbody>
      </table>
    </div>
  </div>
</div>

<div id="solved-view" style="display: none;">
  <div class="content-area-enhanced">
    <h3>Solved Posts (History)</h3>
    <div class="table-container">
      <table class="enhanced-table">
        <thead>
          <tr>
            <th>Name</th>
            <th>Title</th>
            <th>Image</th>
            <th>Location</th>
            <th>Solved At</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="solvedPostsTable"></tbody> 
      </table>
    </div>
  </div>
</div>

<div id="customModalBackdrop" class="custom-modal-backdrop" style="display: none;">
  <div id="customModal" class="custom-modal">
    <h4 id="customModalTitle">Modal Title</h4>
    <p id="customModalMessage">Modal message goes here.</p>
    <input type="text" id="customModalInput" class="custom-modal-input" style="display: none;" />
    <div id="customModalActions" class="custom-modal-actions">
      <button id="customModalBtnCancel" class="btn btn-secondary">Cancel</button>
      <button id="customModalBtnOk" class="btn btn-primary">OK</button>
    </div>
  </div>
</div>

<div id="imageDetailModal" class="image-detail-modal-backdrop">
  <span class="close-detail-modal" onclick="closeImageDetailModal()">&times;</span>
  <div class="image-detail-modal-content">
    <div class="image-detail-modal-image-container">
      <img id="detailModalImage" src="" alt="Post Image">
    </div>
    <div class="image-detail-modal-details-container">
      <h4 id="detailModalTitle">Post Title</h4>
      <p><strong>By:</strong> <span id="detailModalName"></span></p>
      <p style="color: #0a9b06; font-weight: 600;"><i class="bi bi-geo-alt-fill"></i> <span id="detailModalLocation"></span></p>
      <p><strong>Description:</strong></p>
      <p id="detailModalDescription" style="white-space: pre-wrap;"></p>
      <hr>

      <div id="forwarded-post-details">
        <p><strong>Forwarded On:</strong></p>
        <p><span id="detailModalForwardedDate" class="date-pill"></span></p>
      </div>

      <div id="solved-post-details" style="display: none;">
        <p><strong>Posted On:</strong></p>
        <p><span id="detailModalPostedDate" class="date-pill"></span></p>
        
        <p><strong>Forwarded On:</strong></p>
        <p><span id="detailModalForwardedDate_Solved" class="date-pill"></span></p>

        <p><strong>Solved On:</strong></p>
        <p><span id="detailModalSolvedDate" class="date-pill"></span></p>

        <p><strong>Remarks:</strong></p>
        <p id="detailModalRemarks_Solved" style="white-space: pre-wrap; background: #f9f9f9; border: 1px solid #ddd; padding: 10px; border-radius: 5px;"></p>
      </div>
    </div>
  </div>
</div>

<script type="module">
  import { authFetch, logout } from './auth.js';
  window.authFetch = authFetch;
  
  // --- AUTHENTICATION LOGIC ---
  (async function() {
    const token = localStorage.getItem('wastewise_admin_token');
    const userData = localStorage.getItem('wastewise_admin_user');

    if (!token || !userData) {
      window.location.href = 'index.html';
      return;
    }

    try {
      const testResponse = await fetch('https://admin-backend-qkfm.onrender.com/api/approved', {
        headers: {
          'Authorization': `Bearer ${token}`,
          'Content-Type': 'application/json'
        }
      });
      
      if (!testResponse.ok) {
        throw new Error('Token validation failed');
      }
      
      initializeApp();
      
    } catch (err) {
      console.error('Authentication failed:', err);
      localStorage.removeItem('wastewise_admin_token');
      localStorage.removeItem('wastewise_admin_user');
      window.location.href = 'index.html';
    }
  })();

  function initializeApp() {
    fetchPosts();
    fetchSolvedPosts();
  }

  // --- MODAL FUNCTIONS ---
  function getCleanButton(buttonId) {
    const oldBtn = document.getElementById(buttonId);
    const newBtn = oldBtn.cloneNode(true);
    oldBtn.parentNode.replaceChild(newBtn, oldBtn);
    return newBtn;
  }

  window.showAutoCloseAlert = function(title, message) {
    const backdrop = document.getElementById('customModalBackdrop');
    document.getElementById('customModalTitle').textContent = title;
    document.getElementById('customModalMessage').textContent = message;
    document.getElementById('customModalInput').style.display = 'none';
    document.getElementById('customModalBtnCancel').style.display = 'none';
    document.getElementById('customModalBtnOk').style.display = 'none';
    
    backdrop.classList.add('visible');
    backdrop.style.display = 'flex';

    return new Promise((resolve) => {
      setTimeout(() => {
        backdrop.classList.remove('visible');
        setTimeout(() => backdrop.style.display = 'none', 200);
        resolve(true);
      }, 1500);
    });
  };

  window.showCustomAlert = function(title, message) {
    const backdrop = document.getElementById('customModalBackdrop');
    document.getElementById('customModalTitle').textContent = title;
    document.getElementById('customModalMessage').textContent = message;
    document.getElementById('customModalInput').style.display = 'none';
    document.getElementById('customModalBtnCancel').style.display = 'none';
    
    const okBtn = getCleanButton('customModalBtnOk');
    okBtn.style.display = 'inline-block'; 
    okBtn.textContent = 'OK';
    
    backdrop.classList.add('visible');
    backdrop.style.display = 'flex';

    return new Promise((resolve) => {
      okBtn.addEventListener('click', () => {
        backdrop.classList.remove('visible');
        setTimeout(() => backdrop.style.display = 'none', 200);
        resolve(true);
      });
    });
  };

  window.showCustomPrompt = function(title, message) {
    const backdrop = document.getElementById('customModalBackdrop');
    document.getElementById('customModalTitle').textContent = title;
    document.getElementById('customModalMessage').textContent = message;
    
    const input = document.getElementById('customModalInput');
    input.style.display = 'block';
    input.value = ''; 
    
    const okBtn = getCleanButton('customModalBtnOk');
    const cancelBtn = getCleanButton('customModalBtnCancel');
    
    okBtn.style.display = 'inline-block';
    cancelBtn.style.display = 'inline-block';
    okBtn.textContent = 'OK';
    
    backdrop.classList.add('visible');
    backdrop.style.display = 'flex';
    input.focus();

    return new Promise((resolve) => {
      okBtn.addEventListener('click', () => {
        const value = input.value;
        backdrop.classList.remove('visible');
        setTimeout(() => backdrop.style.display = 'none', 200);
        resolve(value);
      });
      
      cancelBtn.addEventListener('click', () => {
        backdrop.classList.remove('visible');
        setTimeout(() => backdrop.style.display = 'none', 200);
        resolve(null);
      });
    });
  };

  // --- HELPER FUNCTIONS ---
  window.formatReadableDate = function(dateString) {
    if (!dateString) return 'N/A';
    const date = new Date(dateString);
    const options = {
      year: 'numeric', month: 'long', day: 'numeric',
      hour: 'numeric', minute: 'numeric', second: 'numeric', hour12: true 
    };
    return new Intl.DateTimeFormat('en-US', options).format(date);
  };

  let allPosts = [];
  let allSolvedPosts = [];
  let currentView = 'approved';

  // --- DATA FETCHING & RENDERING ---
  window.renderSolvedPosts = function(postsToDisplay) {
    const table = document.getElementById('solvedPostsTable');
    table.innerHTML = '';

    if (postsToDisplay.length === 0) {
      table.innerHTML = `
        <tr><td colspan="10" class="empty-state">
          <div class="empty-state-icon">📋</div>
          <h3>No Solved Posts</h3>
          <p>There are no solved posts matching the current filter.</p>
        </td></tr>`;
      return;
    }

    postsToDisplay.forEach(post => {
      const row = document.createElement('tr');
      row.setAttribute('onclick', `showSolvedPostModal('${post.id}')`);
      const imageUrl = post.image || 'placeholder.jpg';

      row.innerHTML = `
        <td data-label="Name"><strong><i class="bi bi-person"></i> ${post.name || 'N/A'}</strong></td>
        <td data-label="Title"><strong>${post.title || 'N/A'}</strong></td>
        <td data-label="Image">
          <img src="${imageUrl}" alt="Post Image" style="width: 250px; height: autopx; object-fit: cover;">
        </td>
        <td style="color: #0a9b06; font-weight: 600;" data-label="Location"><i class="bi bi-geo-alt-fill"></i> ${post.location || 'N/A'}</td>
        <td data-label="Solved At"><span class="date-cell"><i class="bi bi-calendar-check-fill"></i> ${formatReadableDate(post.solved_at)}</span></td>
        <td data-label="Status"><i class="bi bi-check-circle-fill"></i> ${post.status || 'N/A'}</td>
      `;
      table.appendChild(row);
    });
  };

  window.renderPosts = function(postsToDisplay) {
    const table = document.getElementById('postsTable');
    table.innerHTML = '';

    if (postsToDisplay.length === 0) {
      table.innerHTML = `
        <tr><td colspan="7" class="empty-state">
          <div class="empty-state-icon">📋</div>
          <h3>No Approved Posts</h3>
          <p>There are no approved posts matching the current filter.</p>
        </td></tr>`;
      return;
    }

    postsToDisplay.forEach(post => {
      const row = document.createElement('tr');
      row.setAttribute('onclick', `showForwardedPostModal('${post.id}')`);
      const imageUrl = post.image || 'placeholder.jpg';
      
      row.innerHTML = `
        <td data-label="Name"><strong><i class="bi bi-person"></i> ${post.name || 'N/A'}</strong></td>
        <td data-label="Title"><strong>${post.title || 'N/A'}</strong></td>
        <td data-label="Image">
          <img src="${imageUrl}" alt="${post.title}" style="width: 250px; height: autopx; object-fit: cover;" onerror="this.src='placeholder.jpg';"/>
        </td>
        <td style="color: #0a9b06; font-weight: 600;" data-label="Location"><i class="bi bi-geo-alt-fill"></i> ${post.location || 'N/A'}</td>
        <td>
          <div class="action-buttons">
            <button class="btn-enhanced btn-primary-enhanced" onclick="event.stopPropagation(); solvePost('${post.id}')">
              <i class="bi bi-check-circle-fill"></i> Mark as Solved
            </button>
          </div>
        </td>
      `;
      table.appendChild(row);
    });
  };

  // --- COMBINED FILTER LOGIC (Barangay + Date) ---
  window.applyFilters = function() {
    const selectedBarangay = document.getElementById('filterBarangay').value;
    const fromDateVal = document.getElementById('fromDate').value;
    const toDateVal = document.getElementById('toDate').value;

    let postsToFilter = (currentView === 'approved') ? allPosts : allSolvedPosts;
    
    // 1. Filter by Barangay
    if (selectedBarangay !== 'all') {
      postsToFilter = postsToFilter.filter(post => post.location === selectedBarangay);
    }

    // 2. Filter by Date
    // Determine which date field to check based on view
    // Approved View -> check approved_at (Forwarded At)
    // Solved View -> check solved_at
    const dateField = (currentView === 'approved') ? 'approved_at' : 'solved_at';

    if (fromDateVal) {
      const from = new Date(fromDateVal);
      // Reset time to start of day
      from.setHours(0,0,0,0);
      postsToFilter = postsToFilter.filter(post => {
        const postDate = new Date(post[dateField]);
        return postDate >= from;
      });
    }

    if (toDateVal) {
      const to = new Date(toDateVal);
      // Set time to end of day to include the selected day
      to.setHours(23,59,59,999);
      postsToFilter = postsToFilter.filter(post => {
        const postDate = new Date(post[dateField]);
        return postDate <= to;
      });
    }

    // Render
    if (currentView === 'approved') {
      renderPosts(postsToFilter);
    } else {
      renderSolvedPosts(postsToFilter);
    }
  };

  // Legacy wrapper for dropdown onchange
  window.displayFilteredPosts = function() {
    applyFilters();
  };

  window.clearDateFilters = function() {
    document.getElementById('fromDate').value = '';
    document.getElementById('toDate').value = '';
    applyFilters();
  };

  window.fetchPosts = async function() {
    try {
      const response = await authFetch('/api/approved');
      if (!response.ok) throw new Error('Failed to fetch data');
      allPosts = await response.json(); 
      allPosts.sort((a, b) => new Date(b.post_date) - new Date(a.post_date));
      applyFilters(); // Use combined filter logic
    } catch (error) {
      console.error('Error fetching approved posts:', error);
      document.getElementById('postsTable').innerHTML = `<tr><td colspan="7" class="empty-state"><h3>Failed to Load Posts</h3></td></tr>`;
    }
  };

  window.fetchSolvedPosts = async function() {
    try {
      const response = await authFetch('/api/solved-posts');
      if (!response.ok) throw new Error('Failed to fetch solved posts');
      allSolvedPosts = await response.json(); 
      allSolvedPosts.sort((a, b) => new Date(b.solved_at) - new Date(a.solved_at));
      applyFilters(); // Use combined filter logic
    } catch (error) {
      console.error('Error fetching solved posts:', error);
      document.getElementById('solvedPostsTable').innerHTML = `<tr><td colspan="10" class="empty-state"><h3>Failed to Load Solved Posts</h3></td></tr>`;
    }
  };

  window.solvePost = async function(id) {
    const remarks = await showCustomPrompt("Mark this post as solved.", "Please enter your remarks below:");
    if (remarks === null) return;

    if (remarks.trim() === "") {
      await showAutoCloseAlert("Error", "Remarks are required to mark this post as solved.");
      return;
    }
    
    try {
      const response = await authFetch(`/api/solve/${id}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ remarks })
      });

      if (!response.ok) {
        const errorData = await response.json().catch(() => ({ error: 'Failed to solve post' }));
        throw new Error(errorData.error || 'Failed to solve post');
      }

      await showCustomAlert("Success!", "Post marked as solved with remarks!");
      await fetchPosts();
      await fetchSolvedPosts();
    } catch (error) {
      console.error('Error solving post:', error);
      await showCustomAlert('Error', 'Error marking post as solved: ' + error.message);
    }
  };

  window.showForwardedPostModal = function(postId) {
    const post = allPosts.find(p => p.id == postId);
    if (!post) return;
    document.getElementById("detailModalImage").src = post.image || 'placeholder.jpg';
    document.getElementById("detailModalTitle").textContent = post.title || "No Title";
    document.getElementById("detailModalName").textContent = post.name || "Unknown";
    document.getElementById("detailModalLocation").textContent = post.location || "Unknown";
    document.getElementById("detailModalDescription").textContent = post.details || "No Description";
    document.getElementById("detailModalForwardedDate").innerHTML = `<i class="bi bi-calendar-check"></i> ${formatReadableDate(post.approved_at)}`;
    document.getElementById('forwarded-post-details').style.display = 'block';
    document.getElementById('solved-post-details').style.display = 'none';
    document.getElementById("imageDetailModal").style.display = "block";
    document.body.style.overflow = "hidden";
  };

  window.showSolvedPostModal = function(postId) {
    const post = allSolvedPosts.find(p => p.id == postId);
    if (!post) return;
    document.getElementById("detailModalImage").src = post.image || 'placeholder.jpg';
    document.getElementById("detailModalTitle").textContent = post.title || "No Title";
    document.getElementById("detailModalName").textContent = post.name || "Unknown";
    document.getElementById("detailModalLocation").textContent = post.location || "Unknown";
    document.getElementById("detailModalDescription").textContent = post.details || "No Description";
    document.getElementById("detailModalPostedDate").innerHTML = `<i class="bi bi-calendar-event"></i> ${formatReadableDate(post.post_date)}`;
    document.getElementById("detailModalForwardedDate_Solved").innerHTML = `<i class="bi bi-calendar-check"></i> ${formatReadableDate(post.approved_at)}`;
    document.getElementById("detailModalSolvedDate").innerHTML = `<i class="bi bi-calendar-check-fill"></i> ${formatReadableDate(post.solved_at)}`;
    document.getElementById("detailModalRemarks_Solved").textContent = post.remarks || "N/A";
    document.getElementById('forwarded-post-details').style.display = 'none';
    document.getElementById('solved-post-details').style.display = 'block';
    document.getElementById("imageDetailModal").style.display = "block";
    document.body.style.overflow = "hidden";
  };

  window.closeImageDetailModal = function() {
    document.getElementById("imageDetailModal").style.display = "none";
    document.body.style.overflow = "";
  };
  window.onclick = function(event) {
    if (event.target === document.getElementById("imageDetailModal")) closeImageDetailModal();
  }

  window.switchView = function(viewName) {
    currentView = viewName;
    const approvedView = document.getElementById('approved-view');
    const solvedView = document.getElementById('solved-view');
    const approvedBtn = document.getElementById('viewApprovedBtn');
    const solvedBtn = document.getElementById('viewSolvedBtn');

    if (viewName === 'approved') {
      approvedView.style.display = 'block';
      solvedView.style.display = 'none';
      approvedBtn.classList.replace('btn-outline-primary', 'btn-primary');
      solvedBtn.classList.replace('btn-primary', 'btn-outline-primary');
    } else {
      approvedView.style.display = 'none';
      solvedView.style.display = 'block';
      solvedBtn.classList.replace('btn-outline-primary', 'btn-primary');
      approvedBtn.classList.replace('btn-primary', 'btn-outline-primary');
    }
    applyFilters();
  };

  window.onload = async () => {
    // Handled by initializeApp
  };
</script>

</body>
</html>
