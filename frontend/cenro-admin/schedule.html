<body>

<div class="content-area-enhanced">
  <h3>Waste Collection Schedules</h3>
  <div class="table-container">
    <table class="enhanced-table">
      <thead>
        <tr>
          <th>Location</th>
          <th>Scheduled Date</th>
          <th>Date & Time Created</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="scheduleTable"></tbody>

<div id="customModalBackdrop" class="custom-modal-backdrop" style="display: none;">
  <div id="customModal" class="custom-modal">
    <h4 id="customModalTitle">Modal Title</h4>
    <p id="customModalMessage">Modal message goes here.</p>
    <input type="text" id="customModalInput" class="custom-modal-input" style="display: none;" />
    <div id="customModalActions" class="custom-modal-actions">
      <button id="customModalBtnCancel" class="btn btn-secondary">Cancel</button>
      <button id="customModalBtnOk" class="btn btn-primary">OK</button>
    </div>
  </div>
  </div>


<script src="auth.js"></script>
<script>
  // --- ADDED: Modal Functions (with ghost-click fix) ---

  /**
   * Shows a custom, promise-based alert.
   */
  function showCustomAlert(title, message) {
    const backdrop = document.getElementById('customModalBackdrop');
    document.getElementById('customModalTitle').textContent = title;
    document.getElementById('customModalMessage').textContent = message;
    document.getElementById('customModalInput').style.display = 'none';
    document.getElementById('customModalBtnCancel').style.display = 'none';
    
    const okBtn = document.getElementById('customModalBtnOk');
    okBtn.style.display = 'inline-block'; 
    okBtn.textContent = 'OK';
    
    backdrop.classList.add('visible');
    backdrop.style.display = 'flex';

    return new Promise((resolve) => {
      setTimeout(() => {
        const onOkClick = () => {
          backdrop.classList.remove('visible');
          setTimeout(() => backdrop.style.display = 'none', 200);
          resolve(true);
        };
        okBtn.addEventListener('click', onOkClick, { once: true });
      }, 50); 
    });
  }

  /**
   * Shows a custom, promise-based prompt.
   */
  function showCustomPrompt(title, message) {
    const backdrop = document.getElementById('customModalBackdrop');
    document.getElementById('customModalTitle').textContent = title;
    document.getElementById('customModalMessage').textContent = message;
    
    const input = document.getElementById('customModalInput');
    input.style.display = 'block';
    input.value = ''; 
    
    const okBtn = document.getElementById('customModalBtnOk');
    const cancelBtn = document.getElementById('customModalBtnCancel');
    okBtn.style.display = 'inline-block';
    cancelBtn.style.display = 'inline-block';
    okBtn.textContent = 'OK';
    
    backdrop.classList.add('visible');
    backdrop.style.display = 'flex';
    input.focus();

    return new Promise((resolve) => {
      setTimeout(() => {
        const onOkClick = () => {
          const value = input.value;
          backdrop.classList.remove('visible');
          setTimeout(() => backdrop.style.display = 'none', 200);
          cleanup();
          resolve(value); 
        };
        
        const onCancelClick = () => {
          backdrop.classList.remove('visible');
          setTimeout(() => backdrop.style.display = 'none', 200);
          cleanup();
          resolve(null); 
        };

        const cleanup = () => {
          okBtn.removeEventListener('click', onOkClick);
          cancelBtn.removeEventListener('click', onCancelClick);
        };
        
        okBtn.addEventListener('click', onOkClick, { once: true });
        cancelBtn.addEventListener('click', onCancelClick, { once: true });
      }, 50);
    });
  }

  /**
   * Shows a custom, promise-based confirm dialog.
   */
  function showCustomConfirm(title, message) {
    const backdrop = document.getElementById('customModalBackdrop');
    document.getElementById('customModalTitle').textContent = title;
    document.getElementById('customModalMessage').textContent = message;
    document.getElementById('customModalInput').style.display = 'none'; 

    const okBtn = document.getElementById('customModalBtnOk');
    const cancelBtn = document.getElementById('customModalBtnCancel');
    okBtn.style.display = 'inline-block'; 
    cancelBtn.style.display = 'inline-block';
    okBtn.textContent = 'OK';

    backdrop.classList.add('visible');
    backdrop.style.display = 'flex';

    return new Promise((resolve) => {
      setTimeout(() => {
        const onOkClick = () => {
          backdrop.classList.remove('visible');
          setTimeout(() => backdrop.style.display = 'none', 200);
          cleanup();
          resolve(true);
        };

        const onCancelClick = () => {
          backdrop.classList.remove('visible');
          setTimeout(() => backdrop.style.display = 'none', 200);
          cleanup();
          resolve(false);
        };

        const cleanup = () => {
          okBtn.removeEventListener('click', onOkClick);
          cancelBtn.removeEventListener('click', onCancelClick);
        };

        okBtn.addEventListener('click', onOkClick, { once: true });
        cancelBtn.addEventListener('click', onCancelClick, { once: true });
      }, 50);
    });
  }
  
  // --- End of Modal Functions ---


  // Gate: bounce to login if not authenticated
    (async function guard() {
      const r = await authFetch('/api/auth/me');
      if (!r.ok) { location.href = 'index.html'; return; }
    })();

  let allSchedules = []; // Store all schedules for filtering

  async function fetchSchedules() {
    try {
      const response = await authFetch('/api/schedules');
      if (!response.ok) throw new Error('Failed to fetch schedules');

      allSchedules = await response.json();
      filterSchedules(); // Apply current filter
    } catch (error) {
      console.error('Error fetching schedules:', error);
      document.getElementById('scheduleTable').innerHTML = `
        <tr>
          <td colspan="5" class="empty-state">
            <div class="empty-state-icon">⚠️</div>
            <h3>Failed to Load Schedules</h3>
            <p>There was an error loading the schedules. Please try again.</p>
          </td>
        </tr>
      `;
    }
  }

  // Function to format date in alphabetical format
  function formatDateAlphabetical(dateString) {
    const date = new Date(dateString);
    const options = { 
      weekday: 'long', 
      year: 'numeric', 
      month: 'long', 
      day: 'numeric' 
    };
    return date.toLocaleDateString('en-US', options);
  }

  // Function to format date and time
  function formatDateTime(dateString) {
    const date = new Date(dateString);
    const options = { 
      year: 'numeric', 
      month: 'long', 
      day: 'numeric',
      hour: '2-digit',
      minute: '2-digit'
    };
    return date.toLocaleDateString('en-US', options);
  }

  function filterSchedules() {
  const filterValue = document.getElementById("filterBarangay").value;
  const table = document.getElementById("scheduleTable");
  table.innerHTML = '';

  // ✅ Filter out completed schedules
  let filteredSchedules = allSchedules.filter(s => !s.completed);

  // ✅ Filter by selected barangay
  if (filterValue !== 'all') {
    filteredSchedules = filteredSchedules.filter(schedule => schedule.barangay === filterValue);
  }

  if (filteredSchedules.length === 0) {
    const message = filterValue === 'all'
      ? 'No active (uncompleted) waste collection schedules found.'
      : `No active schedules found for ${filterValue}.`;
    table.innerHTML = `
      <tr>
        <td colspan="4" class="empty-state">
          <div class="empty-state-icon">📅</div>
          <h3>No Active Schedules</h3>
          <p>${message}</p>
        </td>
      </tr>
    `;
    return;
  }

  // Sort by schedule date descending
  filteredSchedules.sort((a, b) => new Date(b.schedule_date) - new Date(a.schedule_date));

  // Find the latest schedule per barangay
  const latestByBarangay = {};
  const now = new Date();
  now.setHours(0, 0, 0, 0);

  filteredSchedules.forEach(schedule => {
    const scheduleDate = new Date(schedule.schedule_date);
    scheduleDate.setHours(0, 0, 0, 0);
    if (scheduleDate >= now) {
      if (
        !latestByBarangay[schedule.barangay] ||
        scheduleDate > new Date(latestByBarangay[schedule.barangay].schedule_date)
      ) {
        latestByBarangay[schedule.barangay] = schedule;
      }
    }
  });

  filteredSchedules.forEach(schedule => {
    const row = document.createElement("tr");
    row.setAttribute("data-id", schedule.id);
    const scheduleDate = new Date(schedule.schedule_date);
    const isUpcoming = scheduleDate >= new Date();
    const dateClass = isUpcoming ? 'status-less-urgent' : 'status-urgent';
    const isLatestForBarangay = latestByBarangay[schedule.barangay]?.id === schedule.id;

    row.innerHTML = `
      <td data-label="Location"><strong><i class="bi bi-geo-alt-fill"></i> ${schedule.barangay} - Purok ${schedule.zone_number}</strong></td>
      <td data-label="Scheduled Date"><span class="status-badge ${dateClass}"><i class="bi bi-calendar-check"></i> ${formatDateAlphabetical(schedule.schedule_date)}</span></td>
      <td data-label="Date Created">${formatDateTime(schedule.created_at)}</td>
      <td>
        <div class="action-buttons" style="display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-start; align-items: center;">
          ${isLatestForBarangay ? `
            <button class="btn-enhanced btn-remind" onclick="remindCitizens(${schedule.id}, '${schedule.barangay}', '${schedule.zone_number}', '${schedule.schedule_date}')">
              🔔 Remind Citizens
            </button>
          ` : ''}
          <button class="btn-enhanced btn-mark-done" onclick="markAsDone(${schedule.id})">
            ✅ Mark as Done
          </button>
          <button class="btn-enhanced btn-danger-enhanced" onclick="deleteSchedule(${schedule.id})">
            🗑️ Delete
          </button>
        </div>
      </td>
    `;
    table.appendChild(row);
  });
}


  async function addSchedule() {
    const barangay = document.getElementById("barangaySelect").value;
    const zoneNumber = document.getElementById("zoneNumber").value;
    const selectedDate = document.getElementById("scheduleDate").value;

    if (barangay === "BRGY") {
      await showCustomAlert("Error", "Please select a barangay.");
      return;
    }
    if (!selectedDate) {
      await showCustomAlert("Error", "Please select a date.");
      return;
    }

    const newSchedule = {
      barangay,
      zone_number: parseInt(zoneNumber),
      schedule_date: selectedDate
    };

    try {
      const response = await authFetch('/api/schedules', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(newSchedule)
      });
      if (!response.ok) throw new Error('Failed to save schedule');
      
      await showCustomAlert('Success!', 'Schedule saved!');
      clearFields();
      fetchSchedules();
    } catch (error) {
      console.error('Error saving schedule:', error);
      await showCustomAlert('Error', 'Failed to save schedule.');
    }
  }

  async function markAsDone(id) {
  const didConfirm = await showCustomConfirm(
    "Mark as Done", 
    "Are you sure you want to mark this schedule as completed?"
  );
  if (!didConfirm) return;

  try {
      const response = await authFetch(`/api/schedules/${id}/complete`, {
      method: 'PATCH'
    });
    if (!response.ok) throw new Error('Failed to mark schedule as done');

    // ✅ Remove the schedule row instantly
    const row = document.querySelector(`#scheduleTable tr[data-id='${id}']`);
    if (row) {
      row.style.transition = "opacity 0.4s ease";
      row.style.opacity = "0";
      setTimeout(() => row.remove(), 400);
    }

    await showCustomAlert('Success!', 'Schedule marked as completed!');
    
    // Optional: refresh in background to keep data updated
    fetchSchedules();
  } catch (error) {
    console.error('Error marking schedule as done:', error);
    await showCustomAlert('Error', 'Failed to mark schedule as done.');
  }
}

  async function remindCitizens(id, barangay, zone, date) {
    const formattedDate = formatDateAlphabetical(date);
    const didConfirm = await showCustomConfirm(
      "Send Reminder", 
      `Send a reminder notification to all citizens in ${barangay}, Purok ${zone} about the waste collection scheduled for ${formattedDate}?`
    );
    if (!didConfirm) return;

    try {
      const response = await authFetch(`/api/schedules/${id}/remind`, { 
        method: 'POST',
        headers: { 'Content-Type': 'application/json' }
      });
      if (!response.ok) throw new Error('Failed to send reminder');

      const result = await response.json();
      await showCustomAlert('Success!', `Reminder sent to citizens in ${barangay}!`);
    } catch (error) {
      console.error('Error sending reminder:', error);
      await showCustomAlert('Error', 'Failed to send reminder notification.');
    }
  }

  async function deleteSchedule(id) {
    const didConfirm = await showCustomConfirm(
      "Delete Schedule", 
      "Are you sure you want to delete this schedule?"
    );
    if (!didConfirm) return;

    try {
      const response = await authFetch(`/api/schedules/${id}`, { method: 'DELETE' });
      if (!response.ok) throw new Error('Failed to delete schedule');

      await showCustomAlert('Success!', 'Schedule deleted!');
      fetchSchedules();
    } catch (error) {
      console.error('Error deleting schedule:', error);
      await showCustomAlert('Error', 'Failed to delete schedule.');
    }
  }

  function clearFields() {
    document.getElementById("barangaySelect").selectedIndex = 0;
    document.getElementById("zoneNumber").selectedIndex = 0;
    document.getElementById("scheduleDate").value = "";
  }

  window.onload = () => { fetchSchedules(); };
</script>
</body>
