<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootswatch@4.5.2/dist/minty/bootstrap.min.css"
        crossorigin="anonymous"/>
  <title>Create Admin Account</title>
  <style>
    body { display:flex; min-height:100vh; align-items:center; justify-content:center; }
    .card { width: 360px; }
  </style>
</head>
<body>
  <div class="card p-4 shadow">
    <h4 class="mb-3 text-center">Create Admin Account</h4>
    <div id="msg" class="text-danger mb-2" style="display:none;"></div>
    <form id="registerForm">
      <div class="form-group">
        <label>Username</label>
        <input id="username" class="form-control" autocomplete="username" required/>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input id="password" type="password" class="form-control" autocomplete="new-password" required/>
      </div>
      <button class="btn btn-success btn-block" type="submit">Register</button>
      <button class="btn btn-link btn-block" type="button" onclick="location.href='index.html'">Back to login</button>
    </form>
  </div>

  <script src="auth.js"></script>
  <script>
    // If already logged in, go to dashboard instead
    (async function() {
      if (await checkAuth()) {
        window.location.href = 'analytics.html';
      }
    })();

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Registration failed');

        // Store token if provided (auto-login after registration)
        if (data.token) {
          setToken(data.token);
          window.location.href = 'analytics.html';
        } else {
          // Redirect to login after successful registration
          alert('Account created successfully! Please log in.');
          window.location.href = 'index.html';
        }
      } catch (err) {
        const msg = document.getElementById('msg');
        msg.style.display = 'block';
        msg.textContent = err.message;
      }
    });
  </script>
</body>
</html>
