<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootswatch@4.5.2/dist/minty/bootstrap.min.css" crossorigin="anonymous"/>
  <title>WasteWiseBRGYAdmin — Input</title>
  <style>
    .wrap { max-width:900px; margin:40px auto; }
    .card { background:#fff; border-radius:16px; box-shadow:0 2px 10px rgba(0,0,0,.06); padding:18px; margin-bottom:18px; border:1px solid #cfe9d5; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h4>Barangay Data Input</h4>
      <div>
        <a class="btn btn-outline-secondary btn-sm" href="brgy-analytics.html">Back to Analytics</a>
        <button class="btn btn-outline-danger btn-sm" onclick="logout()">Log out</button>
      </div>
    </div>

    <div class="alert alert-info py-2" id="brgyInfo" style="display:none;"></div>

    <div class="card">
      <h5 class="mb-3">Add Waste Entry</h5>
      <form id="wForm">
        <div class="form-row">
          <div class="form-group col-md-3">
            <label>Category</label>
            <select id="wCategory" class="form-control" required>
              <option>Nabubulok</option><option>Panapon</option>
              <option>Mga Kalakal</option><option>Delikado</option>
            </select>
          </div>
          <div class="form-group col-md-3">
            <label>Kilograms</label>
            <input id="wKg" type="number" step="0.01" min="0" class="form-control" required />
          </div>
          <div class="form-group col-md-3">
            <label>Purok</label>
            <select id="wPurok" class="form-control" required>
              <option>1</option><option>2</option><option>3</option><option>4</option><option>5</option>
              <option>6</option><option>7</option><option>8</option><option>9</option><option>10</option>
            </select>
          </div>
          <div class="form-group col-md-3">
            <label>Week of Month</label>
            <select id="wWeek" class="form-control" required>
              <option>1</option><option>2</option><option>3</option><option>4</option><option>5</option>
            </select>
          </div>
        </div>
        <button class="btn btn-success">Save Waste Entry</button>
      </form>
    </div>

    <div class="card">
      <h5 class="mb-3">Add Complaint</h5>
      <form id="cForm">
        <div class="form-row">
          <div class="form-group col-md-4">
            <label>Category</label>
            <select id="cCategory" class="form-control" required>
              <option>Waste Collection</option>
              <option>Improper Disposal</option>
              <option>Events</option>
              <option>Other</option>
            </select>
          </div>
          <div class="form-group col-md-4">
            <label>Count</label>
            <input id="cCount" type="number" min="0" class="form-control" value="0" required />
          </div>
          <div class="form-group col-md-4">
            <label>Week of Month</label>
            <select id="cWeek" class="form-control" required>
              <option>1</option><option>2</option><option>3</option><option>4</option><option>5</option>
            </select>
          </div>
        </div>
        <button class="btn btn-primary">Save Complaint</button>
      </form>
    </div>
  </div>

<script src="auth.js"></script>
<script>
   const BACKEND_URL = 'https://admin-backend-qkfm.onrender.com';

  (async function guard() {
    const r = await authFetch('/api/brgy/auth/me');
    if (!r.ok) location.href = 'index.html';
  })();

  let BARANGAY = new URLSearchParams(location.search).get('barangay');

  async function resolveBarangay() {
    if (!BARANGAY) {
      const me = await authFetch('/api/brgy/auth/me').then(r=>r.json());
      BARANGAY = me.barangay || prompt('Enter Barangay (e.g., Osorio):') || 'Osorio';
    }
    const info = document.getElementById('brgyInfo');
    info.style.display = 'block';
    info.textContent = `Barangay: ${BARANGAY}`;
  }

  // Save Waste
  document.getElementById('wForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const payload = {
      category:  wCategory.value,
      kilograms: parseFloat(wKg.value),
      barangay:  BARANGAY,
      purok:     parseInt(wPurok.value,10),
      week_of_month: parseInt(wWeek.value,10)
    };
    try {
      const res = await authFetch('/api/brgy/waste-entries', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify(payload)
      });
      if (!res.ok) throw new Error();
      alert('Waste entry saved'); e.target.reset();
    } catch { alert('Could not save waste entry'); }
  });

  // Save Complaint
  document.getElementById('cForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const payload = {
      barangay:  BARANGAY,
      category:  cCategory.value,
      count:     parseInt(cCount.value||'0',10),
      week_of_month: parseInt(cWeek.value,10)
    };
    try {
      const res = await authFetch('/api/brgy/complaints', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify(payload)
      });
      if (!res.ok) throw new Error();
      alert('Complaint saved'); e.target.reset();
    } catch { alert('Could not save complaint'); }
  });

  resolveBarangay();
</script>
</body>
</html>
