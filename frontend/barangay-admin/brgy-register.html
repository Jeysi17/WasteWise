<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootswatch@4.5.2/dist/minty/bootstrap.min.css"
        crossorigin="anonymous"/>
  <title>Barangay Admin — Register</title>
  <style>
    body { display:flex; min-height:100vh; align-items:center; justify-content:center; background:#f7fff8; }
    .card { width: 380px; }
    .password-wrapper {
      position: relative;
    }
    .toggle-btn {
      position: absolute;
      top: 50%;
      right: 10px;
      transform: translateY(-50%);
      border: none;
      background: none;
      cursor: pointer;
      color: #28a745;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="card p-4 shadow">
    <h4 class="mb-3 text-center">Create Barangay Admin</h4>
    <div id="msg" class="text-danger mb-2" style="display:none;"></div>

    <form id="registerForm">
      <div class="form-group">
        <label>Username</label>
        <input id="username" class="form-control" autocomplete="username" required/>
      </div>
      <div class="form-group">
        <label>Password</label>
          <div class="password-wrapper">
          <input id="password" type="password" class="form-control" autocomplete="current-password" required/>
          <button type="button" class="toggle-btn" onclick="password.type = password.type === 'password' ? 'text' : 'password'">Show</button>
        </div>
      </div>
      <div class="form-group">
        <label>Barangay</label>
        <select id="barangay" class="form-control" required translate="no">
          <option value="" disabled selected translate="no">Select barangay</option>
          <option translate="no">Aguado</option>
          <option translate="no">Cabezas</option>
          <option translate="no">Cabuco</option>
          <option translate="no">Conchu</option>
          <option translate="no">De Ocampo</option>
          <option translate="no">Gregorio</option>
          <option translate="no">Hugo Perez</option>
          <option translate="no">Inocencio</option>
          <option translate="no">Lallana</option>
          <option translate="no">Lapidario</option>
          <option translate="no">Luciano</option>
          <option translate="no">Osorio</option>
          <option translate="no">San Agustin</option>
        </select>
      </div>
      <button class="btn btn-success btn-block" type="submit">Register</button>
      <button class="btn btn-link btn-block" type="button" onclick="location.href='index.html'">Back to login</button>
    </form>
  </div>

  <script>
    // Backend URL configuration
    const BACKEND_URL = 'https://wastewise-backend-760x.onrender.com';
    
    // Token management functions (copied from auth.js since we're not importing it)
    const TOKEN_KEY = 'wastewise_brgy_token';
    const USER_KEY = 'wastewise_brgy_user';

    function setToken(token) {
      localStorage.setItem(TOKEN_KEY, token);
    }

    function setUser(user) {
      localStorage.setItem(USER_KEY, JSON.stringify(user));
    }

    function getToken() {
      return localStorage.getItem(TOKEN_KEY);
    }

    // Check if user is already authenticated
    async function checkAuth() {
      const token = getToken();
      if (!token) return false;

      try {
        const res = await fetch(`${BACKEND_URL}/api/brgy/auth/me`, {
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
          }
        });
        return res.ok;
      } catch (err) {
        return false;
      }
    }

    // If already logged in as brgy admin, go to dashboard
    (async function() {
      if (await checkAuth()) {
        location.href = 'brgy-analytics.html';
      }
    })();

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const barangay = document.getElementById('barangay').value;

      // Basic validation
      if (!username || !password || !barangay) {
        showMessage('Please fill in all fields');
        return;
      }

      if (password.length < 6) {
        showMessage('Password must be at least 6 characters long');
        return;
      }

      try {
        console.log('📝 Attempting registration...');
        const res = await fetch(`${BACKEND_URL}/api/brgy/auth/register`, {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ username, password, barangay })
        });

        console.log('📡 Registration response status:', res.status);

        if (!res.ok) {
          const errorData = await res.json().catch(() => ({ error: 'Registration failed' }));
          throw new Error(errorData.error || `Registration failed: ${res.status} ${res.statusText}`);
        }

        const data = await res.json();
        console.log('✅ Registration successful:', data);

        // Store token and user data if provided (auto-login after registration)
        if (data.token && data.user) {
          setToken(data.token);
          setUser(data.user);
          showMessage('Account created successfully! Redirecting...', 'success');
          setTimeout(() => {
            window.location.href = 'brgy-analytics.html';
          }, 1500);
        } else {
          // After registering, send them to login
          showMessage('Account created successfully! Please log in.', 'success');
          setTimeout(() => {
            window.location.href = 'index.html';
          }, 2000);
        }
      } catch (err) {
        console.error('❌ Registration error:', err);
        showMessage(err.message);
      }
    });

    function showMessage(message, type = 'error') {
      const msg = document.getElementById('msg');
      msg.style.display = 'block';
      msg.textContent = message;
      msg.className = type === 'success' ? 'text-success mb-2' : 'text-danger mb-2';
      
      // Auto-hide success messages
      if (type === 'success') {
        setTimeout(() => {
          msg.style.display = 'none';
        }, 5000);
      }
    }

    // Enhanced password toggle
    document.querySelector('.toggle-btn').addEventListener('click', function() {
      const passwordInput = document.getElementById('password');
      const isPassword = passwordInput.type === 'password';
      passwordInput.type = isPassword ? 'text' : 'password';
      this.textContent = isPassword ? 'Hide' : 'Show';
    });
  </script>
</body>
</html>
